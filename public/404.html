<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Redirects 404 requests to index.html preserving path and query
      (function() {
        var path = window.location.pathname;
        var repoBase = '/full-scale-programmatic-seo-app';
        var redirectPath = path;
        if (redirectPath.startsWith(repoBase)) {
          redirectPath = redirectPath.slice(repoBase.length);
        }
        sessionStorage.setItem('spa_redirect', redirectPath + window.location.search + window.location.hash);
        window.location.replace(repoBase + '/');
      })();
    </script>
  </head>
  <body>
    <p>Navigating to requested page...</p>
  </body>
</html>
